# ====== HTTP 80 端口：强制跳转 HTTPS ======
server {
    listen 80;
    server_name _;
    # 所有 HTTP 请求 301 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# ====== HTTPS 443 端口：主服务 ======
server {
    listen 443 ssl;
    server_name _;

    # SSL 证书（从宿主机 /etc/inkheap-certs/ 挂载进来）
    ssl_certificate     /etc/inkheap-certs/fullchain.pem;
    ssl_certificate_key /etc/inkheap-certs/privkey.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 模式回退（vue-router hash 模式下其实不需要，但留着兼容）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API：/api/* → backend:3000/api/*
    # SSE 支持：关闭代理缓冲（流式回复逐段送达）+ 放宽读超时（长回答）
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # 反代后端静态文件：/files/* → backend:3000/files/*
    location /files/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;
}
