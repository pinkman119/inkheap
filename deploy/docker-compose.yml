# INKHEAP 一键部署
#
# 服务编排：PostgreSQL + 后端(NestJS) + 前端(Nginx)
# 前端 Nginx 反代 /api 和 /files 到后端，对外只暴露 80 端口。
#
# 使用：
#   docker compose up -d          启动
#   docker compose logs -f        查看日志
#   docker compose down           停止（-v 同时删数据卷）
#
# 首次启动后端会自动执行 prisma db push 建表 + seed 写入演示数据。
# 后台管理入口：http://服务器IP/#/admin/login  账号 admin / admin123

services:
  postgres:
    # pgvector 镜像：同 PG16 大版本，自带 vector 扩展（数字生命 RAG 向量存储）
    # 注意：从 postgres:16-alpine 切换镜像，部署前请备份 pgdata 卷
    image: pgvector/pgvector:pg16
    container_name: inkheap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: personal_profile
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_profile"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 对外暴露端口，便于本地 npm start 直接连 localhost:5432 调试
    ports:
      - "5432:5432"

  # Redis：数字生命聊天限流（令牌桶）
  redis:
    image: redis:7-alpine
    container_name: inkheap-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 对外暴露端口，便于本地 npm start 直接连 localhost:6379 调试
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    image: inkheap-backend:latest
    container_name: inkheap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/personal_profile?schema=public"
      JWT_SECRET: ${JWT_SECRET:-inkheap-admin-secret-key-2026}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      # 数字生命：Redis 限流
      REDIS_URL: "redis://redis:6379"
      # 数字生命：API Key 加密密钥（32 字节 hex，生产环境务必覆盖）
      # 同时用于邮箱用户密码的 AES-256-GCM 加密（email-auth 模块）
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # 邮件发送（SMTP）：注册验证码 / 密码找回（未配置时相关接口返回服务不可用）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-墨堆 <noreply@inkheap.com>}
    volumes:
      # 上传文件持久化（Docker volume）
      - upload-files:/app/files
    # 后端不直接对外暴露，由 frontend 的 Nginx 反代
    # 如需本地调试可取消注释下一行
    # ports:
    #   - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: inkheap-frontend:latest
    container_name: inkheap-frontend
    restart: unless-stopped
    depends_on:
      # 等后端健康检查通过再启动 nginx，避免启动竞态导致的前期 502
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL 证书：从宿主机挂载到容器内
      # 证书文件放在宿主机的 /etc/inkheap-certs/ 目录下（见 DEPLOY.md）
      - /etc/inkheap-certs:/etc/inkheap-certs:ro

volumes:
  pgdata:
  upload-files:
  redisdata:
