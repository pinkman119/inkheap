version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: pwm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: pwm_db
      POSTGRES_USER: pwm_user
      POSTGRES_PASSWORD: pwm_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pwm_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
