      - heading "旅行感受" [level=2] [ref=f1e78]
      - generic [ref=f1e79]:
        - paragraph [ref=f1e80]: 登顶那一瞬间其实很安静。没有想象中的欢呼，只有风，和一种"原来真的到了"的恍惚。
        - paragraph [ref=f1e81]: 凌晨四点从大本营出发，头灯连成一条歪歪扭扭的线，在黑暗里往上爬。四姑娘山大峰是入门级雪山，但 4400 米的含氧量依旧会让每一步都变得沉重。走到垭口时风大得站不稳，我把自己缩在石头后面等天亮。
        - paragraph [ref=f1e82]: 然后光来了。先是山脊线被描了一道金边，接着整片幺妹峰被点燃，云海在脚下慢慢亮起来。那一刻我忘了冷，也忘了累，只觉得——所有的提前准备、所有的不确定，都为了这二十分钟。
        - blockquote [ref=f1e83]:
          - paragraph [ref=f1e84]: 登山最迷人的地方，是它把"坚持"这件事变得毫无商量余地：你只能一步一步，没有退路，也没有捷径。
        - paragraph [ref=f1e85]: 下撤比上攀更难，膝盖在抗议，但心情是轻的。回到镇上喝到那碗热汤时，我忽然懂了为什么那么多人会上瘾——不是为了征服，是为了那份干净的、只属于自己的安静。
