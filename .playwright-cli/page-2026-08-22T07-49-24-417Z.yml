                    - text: 的从业者，习惯把模糊的需求翻译成可落地的界面与系统。过去 6 年里，我在设计系统、B 端中台与开发者工具之间往返，相信好的产品来自设计约束与工程可行性的反复对齐。
                  - paragraph [ref=f2e799]:
                    - text: 工作之余以「墨堆」为名记录技术随笔，把读过的论文、踩过的坑、想通的设计原则沉淀成文字。我追求一种
